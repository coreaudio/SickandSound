<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Vorräte – Sick & Sound</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    .vorraete-list { display: flex; flex-direction: column; gap: 6px; }

    .vorrat-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: #1c2130;
      border-radius: 14px;
      border: 2px solid #2a3042;
      transition: transform 0.2s ease, opacity 0.2s ease, border-color 0.2s, background 0.2s;
      cursor: pointer;
      user-select: none;
    }
    .vorrat-item:active { transform: scale(0.98); }
    .vorrat-item.available {
      border-color: rgba(124, 252, 154, 0.4);
      background: rgba(124, 252, 154, 0.05);
    }
    .vorrat-item.unavailable {
      border-color: rgba(255, 107, 107, 0.3);
      background: rgba(255, 107, 107, 0.05);
    }

    .vorrat-status {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 800;
      transition: all 0.2s;
    }
    .vorrat-item.available .vorrat-status {
      background: rgba(124, 252, 154, 0.2);
      border: 2px solid #7CFC9A;
      color: #7CFC9A;
    }
    .vorrat-item.unavailable .vorrat-status {
      background: rgba(255, 107, 107, 0.15);
      border: 2px solid #ff6b6b;
      color: #ff6b6b;
    }

    .vorrat-name {
      flex: 1;
      font-weight: 700;
      font-size: 16px;
    }
    .vorrat-item.unavailable .vorrat-name { color: #9ca3af; }

    .stats-bar { display: flex; gap: 12px; margin-bottom: 12px; }
    .stat-pill {
      flex: 1; padding: 12px 16px;
      background: #1c2130; border-radius: 12px; text-align: center;
    }
    .stat-pill.ok  { background: rgba(124,252,154,0.08); }
    .stat-pill.bad { background: rgba(255,107,107,0.10); }
    .stat-number { font-size: 24px; font-weight: 800; }
    .stat-pill.ok  .stat-number { color: #7CFC9A; }
    .stat-pill.bad .stat-number { color: #ff6b6b; }
    .stat-text { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6; }

    .add-section { display: flex; gap: 10px; margin-bottom: 12px; }
    .add-input {
      flex: 1; padding: 14px 16px;
      border-radius: 14px; border: 2px solid #2a3042;
      background: #0e1422; color: #e6e8ef; font-size: 15px; font-weight: 600;
    }
    .add-input:focus { border-color: #6ee7ff; outline: none; }
    .add-input::placeholder { color: #4a5568; font-weight: 400; }
    .add-btn {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, #6ee7ff, #a78bfa);
      color: #0b0e14; font-size: 24px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      border: none; cursor: pointer; flex-shrink: 0;
    }
    .add-btn:active { transform: scale(0.95); }

    .empty-state { text-align: center; padding: 40px 20px; }
    .empty-icon  { font-size: 56px; margin-bottom: 12px; }
    .empty-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
    .empty-sub   { font-size: 14px; opacity: 0.6; max-width: 260px; margin: 0 auto; }

    .swipe-hint { font-size: 11px; opacity: 0.35; text-align: center; padding: 8px; }

    .drag-handle {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; touch-action: none;
    }
    .vorrat-item.dragging {
      box-shadow: 0 8px 32px rgba(0,0,0,0.55);
      z-index: 100; opacity: 0.92;
    }
    .appbar-all-btn {
      padding: 8px 14px; border-radius: 10px;
      background: rgba(110,231,255,0.1); border: 1px solid rgba(110,231,255,0.2);
      color: #6ee7ff; font-size: 13px; font-weight: 700; cursor: pointer;
      white-space: nowrap;
    }
    .appbar-all-btn:active { opacity: 0.7; transform: scale(0.95); }
  </style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="app-title">
      <div class="brand-dot"></div>
      <h1>Vorräte</h1>
    </div>
    <div class="appbar-actions">
      <button class="appbar-all-btn" onclick="markAllAvailable()">✓ Alle</button>
    </div>
  </header>

  <main class="content">
    <div class="stats-bar">
      <div class="stat-pill ok">
        <div class="stat-number" id="availCount">0</div>
        <div class="stat-text">Vorhanden</div>
      </div>
      <div class="stat-pill bad">
        <div class="stat-number" id="missingCount">0</div>
        <div class="stat-text">Fehlt</div>
      </div>
    </div>

    <div class="add-section">
      <input type="text" class="add-input" id="newItem"
             placeholder="Artikel hinzufügen..."
             onkeypress="if(event.key==='Enter')addItem()">
      <button class="add-btn" onclick="addItem()">+</button>
    </div>

    <div class="card" style="padding:16px" id="listCard">
      <div class="vorraete-list" id="vorraeteList">
        <div class="sub" style="text-align:center;padding:20px">Lade Vorräte…</div>
      </div>
    </div>

    <div class="swipe-hint">← Swipe zum Löschen</div>
  </main>

  <nav class="bottomnav" id="bottomNav"></nav>
</div>

<div id="toast" style="
  position:fixed;bottom:calc(var(--nav-h,64px) + 12px);left:50%;transform:translateX(-50%);
  background:#1c2130;border:1px solid #2a3042;padding:10px 18px;
  border-radius:12px;font-size:13px;font-weight:700;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:200;white-space:nowrap
"></div>
<style>#toast.show { opacity: 1; }</style>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
  renderBottomNav('vorraete');

  let items = [];
  let swipe = null;
  let drag  = null;

  function getSorted() {
    return [...items].sort((a, b) => {
      const oa = a.sortOrder ?? Infinity;
      const ob = b.sortOrder ?? Infinity;
      if (oa !== ob) return oa - ob;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
  }

  function renderList() {
    const list    = document.getElementById('vorraeteList');
    const avail   = items.filter(i => i.available).length;
    const missing = items.filter(i => !i.available).length;
    document.getElementById('availCount').textContent   = avail;
    document.getElementById('missingCount').textContent = missing;

    if (!items.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📦</div>
          <div class="empty-title">Noch keine Einträge</div>
          <div class="empty-sub">Tippe oben auf + um Artikel hinzuzufügen.</div>
        </div>`;
      return;
    }

    const sorted = getSorted();
    list.innerHTML = sorted.map(item => `
      <div class="vorrat-item ${item.available ? 'available' : 'unavailable'}"
           data-id="${item.id}"
           onclick="toggleItem('${item.id}')">
        <div class="vorrat-status">${item.available ? '✓' : '✗'}</div>
        <div class="vorrat-name">${item.name}</div>
        <div class="drag-handle" onclick="event.stopPropagation()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" opacity=".3">
            <circle cx="9" cy="7" r="1.8"/><circle cx="15" cy="7" r="1.8"/>
            <circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/>
            <circle cx="9" cy="17" r="1.8"/><circle cx="15" cy="17" r="1.8"/>
          </svg>
        </div>
      </div>
    `).join('');
  }

  async function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (!item || !db) return;
    const next = !item.available;
    await db.collection('vorraete').doc(id).update({ available: next });
    showToast(next ? `✓ ${item.name} vorhanden` : `✗ ${item.name} fehlt`);
  }

  async function addItem() {
    const input = document.getElementById('newItem');
    const name  = input.value.trim();
    if (!name) return;
    if (!db) { alert('Offline – keine Verbindung'); return; }
    const maxOrder = items.length ? Math.max(...items.map(i => i.sortOrder ?? -1)) : -1;
    await db.collection('vorraete').add({ name, available: true, createdAt: Date.now(), sortOrder: maxOrder + 1 });
    input.value = '';
    input.focus();
  }

  async function deleteItem(id) {
    const item = items.find(i => i.id === id);
    if (!db) return;
    await db.collection('vorraete').doc(id).delete();
    if (item) showToast(`„${item.name}" entfernt`);
  }

  async function markAllAvailable() {
    if (!db || !items.length) return;
    const missing = items.filter(i => !i.available);
    if (!missing.length) { showToast('Alle bereits vorhanden ✓'); return; }
    const batch = db.batch();
    missing.forEach(i => batch.update(db.collection('vorraete').doc(i.id), { available: true }));
    await batch.commit();
    showToast(`${missing.length} Artikel auf vorhanden gesetzt ✓`);
  }

  function initInteractions() {
    const list = document.getElementById('vorraeteList');

    list.addEventListener('touchstart', e => {
      if (e.target.closest('.drag-handle')) {
        e.preventDefault();
        const el = e.target.closest('.vorrat-item');
        if (!el) return;
        const all = [...list.querySelectorAll('.vorrat-item')];
        const idx = all.indexOf(el);
        el.classList.add('dragging');
        drag = { el, startIdx: idx, curIdx: idx,
                 startY: e.touches[0].clientY, rowH: el.offsetHeight + 6 };
        return;
      }
      const el = e.target.closest('.vorrat-item');
      if (!el) return;
      swipe = { el, id: el.dataset.id,
                startX: e.touches[0].clientX, startY: e.touches[0].clientY };
    }, { passive: false });

    list.addEventListener('touchmove', e => {
      if (drag) {
        e.preventDefault();
        const dy = e.touches[0].clientY - drag.startY;
        drag.el.style.transform = `translateY(${dy}px)`;

        const all    = [...list.querySelectorAll('.vorrat-item')];
        const newIdx = Math.max(0, Math.min(all.length - 1,
          drag.startIdx + Math.round(dy / drag.rowH)));
        drag.curIdx  = newIdx;

        all.forEach((el, i) => {
          if (el === drag.el) return;
          let shift = 0;
          if (newIdx < drag.startIdx && i >= newIdx && i < drag.startIdx) shift =  drag.rowH;
          if (newIdx > drag.startIdx && i >  drag.startIdx && i <= newIdx) shift = -drag.rowH;
          el.style.transition = 'transform 0.15s ease';
          el.style.transform  = shift ? `translateY(${shift}px)` : '';
        });
        return;
      }
      if (!swipe?.el) return;
      const dx = e.touches[0].clientX - swipe.startX;
      const dy = e.touches[0].clientY - swipe.startY;
      if (Math.abs(dy) > Math.abs(dx) + 5) { swipe = null; return; }
      if (Math.abs(dx) > 6) e.preventDefault();
      const x = Math.max(-90, Math.min(0, dx));
      swipe.el.style.transition = 'none';
      swipe.el.style.transform  = `translateX(${x}px)`;
      swipe.el.style.opacity    = x < -40 ? String(Math.max(0, 1 - (Math.abs(x + 40) / 55))) : '';
    }, { passive: false });

    list.addEventListener('touchend', e => {
      if (drag) {
        const { el, startIdx, curIdx } = drag;
        drag = null;

        if (curIdx !== startIdx) {
          const sorted = getSorted();
          const moved  = sorted.splice(startIdx, 1)[0];
          sorted.splice(curIdx, 0, moved);
          sorted.forEach((item, i) => {
            const local = items.find(it => it.id === item.id);
            if (local) local.sortOrder = i;
          });
          renderList();
          if (db) {
            const batch = db.batch();
            sorted.forEach((item, i) =>
              batch.update(db.collection('vorraete').doc(item.id), { sortOrder: i }));
            batch.commit().catch(console.error);
          }
        } else {
          [...list.querySelectorAll('.vorrat-item')].forEach(el => {
            el.style.transform = ''; el.style.transition = '';
          });
          el.classList.remove('dragging');
        }
        return;
      }
      if (!swipe?.el) return;
      const dx = e.changedTouches[0].clientX - swipe.startX;
      swipe.el.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
      if (Math.abs(dx) > 10) e.preventDefault();
      if (dx < -70) {
        const id = swipe.id;
        swipe.el.style.transform = 'translateX(-110%)';
        swipe.el.style.opacity   = '0';
        setTimeout(() => deleteItem(id), 220);
      } else {
        swipe.el.style.transform = '';
        swipe.el.style.opacity   = '';
      }
      swipe = null;
    }, { passive: false });
  }

  if (db) {
    db.collection('vorraete').onSnapshot(snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderList();
    });
    initInteractions();
  } else {
    document.getElementById('vorraeteList').innerHTML =
      '<div class="sub" style="text-align:center;padding:20px">Offline – keine Verbindung</div>';
  }
</script>
</body>
</html>
