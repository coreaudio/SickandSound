<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Vorräte – Sick & Sound</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090f" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    .vorraete-list { display: flex; flex-direction: column; gap: 8px; }

    .vorrat-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--panel-3);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      transition: transform 0.2s ease, opacity 0.2s ease, border-color 0.2s, background 0.2s;
      cursor: pointer;
      user-select: none;
    }
    .vorrat-item:active { transform: scale(0.98); }
    .vorrat-item.available {
      border-color: rgba(16,217,160,.28);
      background: rgba(16,217,160,.04);
    }
    .vorrat-item.unavailable {
      border-color: rgba(244,63,94,.22);
      background: rgba(244,63,94,.04);
    }

    .vorrat-status {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 800;
      transition: all 0.2s;
    }
    .vorrat-item.available .vorrat-status {
      background: rgba(16,217,160,.15);
      border: 2px solid rgba(16,217,160,.5);
      color: var(--green);
    }
    .vorrat-item.unavailable .vorrat-status {
      background: rgba(244,63,94,.12);
      border: 2px solid rgba(244,63,94,.4);
      color: var(--danger);
    }

    .vorrat-name {
      flex: 1;
      font-weight: 700;
      font-size: 16px;
    }
    .vorrat-item.unavailable .vorrat-name { color: var(--muted); }

    .stats-bar { display: flex; gap: 10px; margin-bottom: 12px; }
    .stat-pill {
      flex: 1; padding: 12px 16px;
      background: var(--panel-3); border-radius: 16px; text-align: center;
      border: 1px solid var(--border);
    }
    .stat-pill.ok  { background: rgba(16,217,160,.06); border-color: rgba(16,217,160,.2); }
    .stat-pill.bad { background: rgba(244,63,94,.06); border-color: rgba(244,63,94,.2); }
    .stat-number { font-size: 24px; font-weight: 800; }
    .stat-pill.ok  .stat-number { color: var(--green); }
    .stat-pill.bad .stat-number { color: var(--danger); }
    .stat-text { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }

    .add-section { display: flex; gap: 10px; margin-bottom: 12px; }
    .add-input {
      flex: 1; padding: 14px 16px;
      border-radius: var(--r-sm); border: 1px solid var(--border2);
      background: var(--panel-2); color: var(--txt); font-size: 15px; font-weight: 600;
      font-family: inherit;
    }
    .add-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-dim); }
    .add-input::placeholder { color: var(--muted); font-weight: 400; }
    .add-btn {
      width: 52px; height: 52px; border-radius: var(--r-sm);
      background: var(--accent);
      color: #04120f; font-size: 24px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      border: none; cursor: pointer; flex-shrink: 0;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .add-btn:active { transform: scale(0.95); }

    .empty-state { text-align: center; padding: 40px 20px; }
    .empty-icon  { font-size: 56px; margin-bottom: 12px; }
    .empty-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
    .empty-sub   { font-size: 14px; color: var(--muted); max-width: 260px; margin: 0 auto; }

    .swipe-hint { font-size: 11px; color: var(--muted); opacity: 0.5; text-align: center; padding: 8px; }

    .drag-handle {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; touch-action: none;
    }
    .vorrat-item.dragging {
      box-shadow: 0 12px 40px rgba(0,0,0,.6);
      z-index: 100; opacity: 0.92;
    }
    .appbar-all-btn {
      padding: 8px 16px; border-radius: 999px;
      background: var(--accent-dim); border: 1px solid rgba(45,212,191,.28);
      color: var(--accent); font-size: 13px; font-weight: 700; cursor: pointer;
      white-space: nowrap;
    }
    .appbar-all-btn:active { opacity: 0.7; transform: scale(0.95); }
    .appbar-groups-btn {
      padding: 8px 16px; border-radius: 999px;
      background: var(--panel-3); border: 1px solid var(--border2);
      color: var(--txt); font-size: 13px; font-weight: 700; cursor: pointer;
      white-space: nowrap;
    }
    .appbar-groups-btn:active { opacity: 0.7; transform: scale(0.95); }

    .group-select {
      padding: 0 12px;
      border-radius: var(--r-sm); border: 1px solid var(--border2);
      background: var(--panel-2); color: var(--txt); font-size: 13px; font-weight: 600;
      font-family: inherit; max-width: 130px; flex-shrink: 0;
    }

    .group-header {
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px;
      color: var(--muted); padding: 14px 4px 6px;
    }
    .group-header:first-child { padding-top: 2px; }
    .group-empty-hint { font-size: 12px; color: var(--muted); opacity: .6; padding: 0 4px 8px; }

    .vorrat-name-wrap { flex: 1; min-width: 0; }
    .vorrat-target { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .item-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .edit-handle {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 14px; opacity: .55;
    }

    .group-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .group-row:last-child { border-bottom: none; }
    .group-row input {
      flex: 1; padding: 10px 12px;
      border-radius: var(--r-sm); border: 1px solid var(--border2);
      background: var(--panel-2); color: var(--txt); font-size: 14px; font-weight: 600;
      font-family: inherit;
    }
    .field-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 0 6px; }
    .field-label:first-child { margin-top: 0; }
    .qty-row { display: flex; gap: 10px; }
    .qty-row input { flex: 1; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions .btn { flex: 1; }
  </style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="app-title">
      <div class="brand-dot"></div>
      <h1>Vorräte</h1>
    </div>
    <div class="appbar-actions">
      <button class="appbar-groups-btn" onclick="openGroupsModal()">🗂 Gruppen</button>
      <button class="appbar-all-btn" onclick="markAllMissing()">✗ Alle</button>
    </div>
  </header>

  <main class="content">
    <div class="stats-bar">
      <div class="stat-pill ok">
        <div class="stat-number" id="availCount">0</div>
        <div class="stat-text">Vorhanden</div>
      </div>
      <div class="stat-pill bad">
        <div class="stat-number" id="missingCount">0</div>
        <div class="stat-text">Fehlt</div>
      </div>
    </div>

    <div class="add-section">
      <input type="text" class="add-input" id="newItem"
             placeholder="Artikel hinzufügen..."
             onkeypress="if(event.key==='Enter')addItem()">
      <select class="group-select" id="newItemGroup"><option value="">Ohne Gruppe</option></select>
      <button class="add-btn" onclick="addItem()">+</button>
    </div>

    <div class="card" style="padding:16px" id="listCard">
      <div class="vorraete-list" id="vorraeteList">
        <div class="sub" style="text-align:center;padding:20px">Lade Vorräte…</div>
      </div>
    </div>

    <div class="swipe-hint">← Swipe zum Löschen</div>
  </main>

  <nav class="bottomnav" id="bottomNav"></nav>
</div>

<!-- Gruppen-Modal -->
<div class="modal" id="groupsModal"><div class="box">
  <h2>🗂 Gruppen verwalten</h2>
  <div id="groupsList"></div>
  <div class="group-row" style="border-bottom:none;padding-top:14px">
    <input type="text" id="newGroupName" placeholder="Neue Gruppe..." onkeypress="if(event.key==='Enter')addGroup()">
    <button class="btn small" onclick="addGroup()">+</button>
  </div>
  <div style="margin-top:14px">
    <button class="btn dark" onclick="closeModal('groupsModal')">Schließen</button>
  </div>
</div></div>

<!-- Artikel-Bearbeiten-Modal -->
<div class="modal" id="itemEditModal"><div class="box">
  <h2>✏️ Artikel bearbeiten</h2>
  <div class="field-label">Name</div>
  <input type="text" class="add-input" id="editItemName" style="width:100%">
  <div class="field-label">Gruppe</div>
  <select class="add-input" id="editItemGroup" style="width:100%"><option value="">Ohne Gruppe</option></select>
  <div class="field-label">Soll-Menge (Orientierung, wieviel da sein sollte)</div>
  <div class="qty-row">
    <input type="number" id="editItemQty" placeholder="Menge" min="0" step="any">
    <input type="text" id="editItemUnit" placeholder="Einheit (z.B. Kisten, g)">
  </div>
  <div class="modal-actions" style="margin-top:16px">
    <button class="btn" onclick="saveItemEdit()">Speichern</button>
    <button class="btn dark" onclick="closeModal('itemEditModal')">Abbrechen</button>
  </div>
</div></div>

<div id="toast" style="
  position:fixed;bottom:calc(var(--nav-h,64px) + 12px);left:50%;transform:translateX(-50%);
  background:rgba(17,22,36,.96);border:1px solid rgba(45,212,191,.2);padding:10px 20px;
  border-radius:999px;font-size:13px;font-weight:700;color:var(--txt);
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:200;white-space:nowrap;
  box-shadow:0 8px 32px rgba(0,0,0,.6)
"></div>
<style>#toast.show { opacity: 1; }</style>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
  renderBottomNav('vorraete');

  let items = [];
  let groups = [];
  let swipe = null;
  let drag  = null;

  function getSortedGroups() {
    return [...groups].sort((a, b) => (a.sortOrder ?? Infinity) - (b.sortOrder ?? Infinity));
  }

  function groupOrderOf(groupId) {
    if (!groupId) return Infinity;
    const g = groups.find(x => x.id === groupId);
    return g ? (g.sortOrder ?? Infinity) : Infinity;
  }

  function getSorted() {
    return [...items].sort((a, b) => {
      const ga = groupOrderOf(a.groupId), gb = groupOrderOf(b.groupId);
      if (ga !== gb) return ga - gb;
      const oa = a.sortOrder ?? Infinity;
      const ob = b.sortOrder ?? Infinity;
      if (oa !== ob) return oa - ob;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
  }

  function itemHtml(item) {
    return `
      <div class="vorrat-item ${item.available ? 'available' : 'unavailable'}"
           data-id="${item.id}"
           onclick="toggleItem('${item.id}')">
        <div class="vorrat-status">${item.available ? '✓' : '✗'}</div>
        <div class="vorrat-name-wrap">
          <div class="vorrat-name">${item.name}</div>
          ${item.targetQty != null && item.targetQty !== '' ? `<div class="vorrat-target">Soll: ${item.targetQty}${item.targetUnit ? ' ' + item.targetUnit : ''}</div>` : ''}
        </div>
        <div class="item-actions">
          <div class="edit-handle" onclick="event.stopPropagation();openItemEdit('${item.id}')">✏️</div>
          <div class="drag-handle" onclick="event.stopPropagation()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" opacity=".3">
              <circle cx="9" cy="7" r="1.8"/><circle cx="15" cy="7" r="1.8"/>
              <circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/>
              <circle cx="9" cy="17" r="1.8"/><circle cx="15" cy="17" r="1.8"/>
            </svg>
          </div>
        </div>
      </div>`;
  }

  function renderList() {
    const list    = document.getElementById('vorraeteList');
    const avail   = items.filter(i => i.available).length;
    const missing = items.filter(i => !i.available).length;
    document.getElementById('availCount').textContent   = avail;
    document.getElementById('missingCount').textContent = missing;

    if (!items.length && !groups.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📦</div>
          <div class="empty-title">Noch keine Einträge</div>
          <div class="empty-sub">Tippe oben auf + um Artikel hinzuzufügen.</div>
        </div>`;
      return;
    }

    const sorted = getSorted();

    if (!groups.length) {
      list.innerHTML = sorted.map(itemHtml).join('');
      return;
    }

    let html = '';
    getSortedGroups().forEach(g => {
      const gItems = sorted.filter(i => i.groupId === g.id);
      html += `<div class="group-header">${g.name}</div>`;
      html += gItems.length ? gItems.map(itemHtml).join('') : `<div class="group-empty-hint">Noch keine Artikel</div>`;
    });
    const groupIds = new Set(groups.map(g => g.id));
    const rest = sorted.filter(i => !i.groupId || !groupIds.has(i.groupId));
    if (rest.length) {
      html += `<div class="group-header">Ohne Gruppe</div>`;
      html += rest.map(itemHtml).join('');
    }
    list.innerHTML = html;
  }

  async function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (!item || !db) return;
    const next = !item.available;
    await db.collection('vorraete').doc(id).update({ available: next });
    showToast(next ? `✓ ${item.name} vorhanden` : `✗ ${item.name} fehlt`);
  }

  async function addItem() {
    const input = document.getElementById('newItem');
    const name  = input.value.trim();
    if (!name) return;
    if (!db) { alert('Offline – keine Verbindung'); return; }
    const groupId = document.getElementById('newItemGroup').value || null;
    const maxOrder = items.length ? Math.max(...items.map(i => i.sortOrder ?? -1)) : -1;
    await db.collection('vorraete').add({
      name, available: true, createdAt: Date.now(), sortOrder: maxOrder + 1,
      groupId, targetQty: null, targetUnit: ''
    });
    input.value = '';
    input.focus();
  }

  function populateGroupSelects() {
    const opts = getSortedGroups().map(g => `<option value="${g.id}">${g.name}</option>`).join('');
    [['newItemGroup', ''], ['editItemGroup', '']].forEach(([id]) => {
      const sel = document.getElementById(id);
      const cur = sel.value;
      sel.innerHTML = `<option value="">Ohne Gruppe</option>${opts}`;
      if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
    });
  }

  function openGroupsModal() {
    renderGroupsList();
    openModal('groupsModal');
  }

  function renderGroupsList() {
    const wrap = document.getElementById('groupsList');
    const sorted = getSortedGroups();
    if (!sorted.length) {
      wrap.innerHTML = `<div class="sub" style="padding:8px 0;opacity:.6">Noch keine Gruppen angelegt.</div>`;
      return;
    }
    wrap.innerHTML = sorted.map(g => `
      <div class="group-row">
        <input type="text" value="${g.name.replace(/"/g,'&quot;')}" onchange="renameGroup('${g.id}', this.value)">
        <button class="btn small warning" onclick="deleteGroup('${g.id}')">🗑</button>
      </div>
    `).join('');
  }

  async function addGroup() {
    const input = document.getElementById('newGroupName');
    const name = input.value.trim();
    if (!name || !db) return;
    const maxOrder = groups.length ? Math.max(...groups.map(g => g.sortOrder ?? -1)) : -1;
    await db.collection('vorratsgruppen').add({ name, sortOrder: maxOrder + 1 });
    input.value = '';
  }

  async function renameGroup(id, name) {
    name = name.trim();
    if (!name || !db) return;
    await db.collection('vorratsgruppen').doc(id).update({ name });
    showToast('Gruppe umbenannt');
  }

  async function deleteGroup(id) {
    if (!db) return;
    const g = groups.find(x => x.id === id);
    const batch = db.batch();
    items.filter(i => i.groupId === id).forEach(i =>
      batch.update(db.collection('vorraete').doc(i.id), { groupId: null }));
    batch.delete(db.collection('vorratsgruppen').doc(id));
    await batch.commit();
    if (g) showToast(`Gruppe „${g.name}" gelöscht`);
  }

  let _editItemId = null;

  function openItemEdit(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    _editItemId = id;
    populateGroupSelects();
    document.getElementById('editItemName').value  = item.name;
    document.getElementById('editItemGroup').value = item.groupId || '';
    document.getElementById('editItemQty').value   = item.targetQty ?? '';
    document.getElementById('editItemUnit').value  = item.targetUnit || '';
    openModal('itemEditModal');
  }

  async function saveItemEdit() {
    if (!_editItemId || !db) return;
    const name = document.getElementById('editItemName').value.trim();
    if (!name) { showToast('Name darf nicht leer sein'); return; }
    const groupId   = document.getElementById('editItemGroup').value || null;
    const qtyVal    = document.getElementById('editItemQty').value;
    const targetQty = qtyVal === '' ? null : parseFloat(qtyVal);
    const targetUnit = document.getElementById('editItemUnit').value.trim();
    await db.collection('vorraete').doc(_editItemId).update({ name, groupId, targetQty, targetUnit });
    closeModal('itemEditModal');
    showToast('Artikel aktualisiert');
  }

  async function deleteItem(id) {
    const item = items.find(i => i.id === id);
    if (!db) return;
    await db.collection('vorraete').doc(id).delete();
    if (item) showToast(`„${item.name}" entfernt`);
  }

  async function markAllMissing() {
    if (!db || !items.length) return;
    const available = items.filter(i => i.available);
    if (!available.length) { showToast('Bereits alle auf fehlend ✗'); return; }
    const batch = db.batch();
    available.forEach(i => batch.update(db.collection('vorraete').doc(i.id), { available: false }));
    await batch.commit();
    showToast(`${available.length} Artikel auf fehlend gesetzt ✗`);
  }

  function initInteractions() {
    const list = document.getElementById('vorraeteList');

    list.addEventListener('touchstart', e => {
      if (e.target.closest('.drag-handle')) {
        e.preventDefault();
        const el = e.target.closest('.vorrat-item');
        if (!el) return;
        const all = [...list.querySelectorAll('.vorrat-item')];
        const idx = all.indexOf(el);
        el.classList.add('dragging');
        drag = { el, startIdx: idx, curIdx: idx,
                 startY: e.touches[0].clientY, rowH: el.offsetHeight + 6 };
        return;
      }
      const el = e.target.closest('.vorrat-item');
      if (!el) return;
      swipe = { el, id: el.dataset.id,
                startX: e.touches[0].clientX, startY: e.touches[0].clientY };
    }, { passive: false });

    list.addEventListener('touchmove', e => {
      if (drag) {
        e.preventDefault();
        const dy = e.touches[0].clientY - drag.startY;
        drag.el.style.transform = `translateY(${dy}px)`;

        const all    = [...list.querySelectorAll('.vorrat-item')];
        const newIdx = Math.max(0, Math.min(all.length - 1,
          drag.startIdx + Math.round(dy / drag.rowH)));
        drag.curIdx  = newIdx;

        all.forEach((el, i) => {
          if (el === drag.el) return;
          let shift = 0;
          if (newIdx < drag.startIdx && i >= newIdx && i < drag.startIdx) shift =  drag.rowH;
          if (newIdx > drag.startIdx && i >  drag.startIdx && i <= newIdx) shift = -drag.rowH;
          el.style.transition = 'transform 0.15s ease';
          el.style.transform  = shift ? `translateY(${shift}px)` : '';
        });
        return;
      }
      if (!swipe?.el) return;
      const dx = e.touches[0].clientX - swipe.startX;
      const dy = e.touches[0].clientY - swipe.startY;
      if (Math.abs(dy) > Math.abs(dx) + 5) { swipe = null; return; }
      if (Math.abs(dx) > 6) e.preventDefault();
      const x = Math.max(-90, Math.min(0, dx));
      swipe.el.style.transition = 'none';
      swipe.el.style.transform  = `translateX(${x}px)`;
      swipe.el.style.opacity    = x < -40 ? String(Math.max(0, 1 - (Math.abs(x + 40) / 55))) : '';
    }, { passive: false });

    list.addEventListener('touchend', e => {
      if (drag) {
        const { el, startIdx, curIdx } = drag;
        drag = null;

        if (curIdx !== startIdx) {
          const sorted = getSorted();
          const moved  = sorted.splice(startIdx, 1)[0];
          sorted.splice(curIdx, 0, moved);
          sorted.forEach((item, i) => {
            const local = items.find(it => it.id === item.id);
            if (local) local.sortOrder = i;
          });
          renderList();
          if (db) {
            const batch = db.batch();
            sorted.forEach((item, i) =>
              batch.update(db.collection('vorraete').doc(item.id), { sortOrder: i }));
            batch.commit().catch(console.error);
          }
        } else {
          [...list.querySelectorAll('.vorrat-item')].forEach(el => {
            el.style.transform = ''; el.style.transition = '';
          });
          el.classList.remove('dragging');
        }
        return;
      }
      if (!swipe?.el) return;
      const dx = e.changedTouches[0].clientX - swipe.startX;
      swipe.el.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
      if (Math.abs(dx) > 10) e.preventDefault();
      if (dx < -70) {
        const id = swipe.id;
        swipe.el.style.transform = 'translateX(-110%)';
        swipe.el.style.opacity   = '0';
        setTimeout(() => deleteItem(id), 220);
      } else {
        swipe.el.style.transform = '';
        swipe.el.style.opacity   = '';
      }
      swipe = null;
    }, { passive: false });
  }

  if (db) {
    db.collection('vorraete').onSnapshot(snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderList();
    });
    db.collection('vorratsgruppen').onSnapshot(snap => {
      groups = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      populateGroupSelects();
      renderGroupsList();
      renderList();
    });
    initInteractions();
  } else {
    document.getElementById('vorraeteList').innerHTML =
      '<div class="sub" style="text-align:center;padding:20px">Offline – keine Verbindung</div>';
  }
</script>
</body>
</html>
